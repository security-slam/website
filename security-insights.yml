header:
  schema-version: 2.2.0
  last-updated: '2026-10-01'
  last-reviewed: '2026-10-01'
  url: https://github.com/security-slam/website/raw/main/security-insights.yml

project:
  name: OpenSSF Security Slam Website
  homepage: https://securityslam.com/
  administrators:
    - name: Eddie Knight
      primary: true
      social: https://github.com/eddie-knight
    - name: Jason Meridth
      primary: false
      email: jmeridth@gmail.com
      social: https://github.com/jmeridth
  documentation:
    detailed-guide: https://github.com/security-slam/website/blob/main/README.md
    support-policy: https://github.com/security-slam/website/blob/main/SECURITY.md#support-period-and-end-of-life
  repositories:
    - name: website
      url: https://github.com/security-slam/website
      comment: Source for the Security Slam website, deployed to GitHub Pages.
  vulnerability-reporting:
    reports-accepted: true
    bug-bounty-available: false
    policy: https://github.com/security-slam/website/blob/main/SECURITY.md
    contact:
      name: Jason Meridth
      primary: true
      email: jmeridth@gmail.com
    comment: >-
      Report vulnerabilities through GitHub private vulnerability reporting:
      https://github.com/security-slam/website/security/advisories/new

repository:
  url: https://github.com/security-slam/website
  status: active
  accepts-change-request: true
  accepts-automated-change-request: true
  core-team:
    - name: Eddie Knight
      primary: true
      social: https://github.com/eddie-knight
    - name: Jason Meridth
      primary: false
      email: jmeridth@gmail.com
      social: https://github.com/jmeridth
    - name: Maxime Coquerel
      primary: false
      social: https://github.com/zigmax
    - name: Satarupa Deb
      primary: false
      social: https://github.com/Satarupa22-SD
    - name: Stacey Potter
      primary: false
      social: https://github.com/staceypotter
  documentation:
    contributing-guide: https://github.com/security-slam/website/blob/main/CONTRIBUTING.md
    security-policy: https://github.com/security-slam/website/blob/main/SECURITY.md
  # Code is Apache-2.0 (LICENSE). Written content is CC-BY-4.0 (LICENSE-CONTENT):
  # https://github.com/security-slam/website/blob/main/LICENSE-CONTENT
  license:
    url: https://github.com/security-slam/website/blob/main/LICENSE
    expression: Apache-2.0 AND CC-BY-4.0
  security:
    assessments:
      self:
        name: Gemara threat and capability catalogs
        evidence: https://github.com/security-slam/website/blob/main/threat-catalog.yaml
        date: '2026-09-30'
        comment: >-
          Gemara threat catalog (SEC.SLAM.WEB) with its companion capability
          catalog (SEC.SLAM.WEB.CAP) at
          https://github.com/security-slam/website/blob/main/capability-catalog.yaml
      third-party:
        - name: OpenSSF Best Practices OSPS Baseline
          evidence: https://www.bestpractices.dev/projects/15142/baseline-1
          date: '2026-10-01'
          comment: OSPS Baseline Level 1 (criteria v2026.08.28), self-reported on bestpractices.dev with autodetected answers.
    tools:
      - name: OSPS Baseline Scanner
        type: other
        rulesets:
          - osps-baseline-2026-08
        integration:
          adhoc: false
          ci: true
          release: false
        results:
          ci:
            name: OSPS Baseline evaluation
            predicate-uri: https://github.com/revanite-io/osps-baseline-action
            location: https://github.com/security-slam/website/actions/workflows/osps-baseline.yaml
        comment: >-
          Runs weekly and on every push to main with a read-only octo-sts
          token. Failed controls also appear in the repository Security tab.
